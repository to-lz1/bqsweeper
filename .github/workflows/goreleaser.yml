name: goreleaser

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-go@v6.2.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
