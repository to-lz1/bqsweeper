version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - iface
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - nosprintfhostport
    - prealloc
    - sloglint
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
